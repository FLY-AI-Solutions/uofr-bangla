<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UofR Bangla | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/uofr-bangla.css?v=20260829-1" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="UofR Bangla home">
        <span class="brand-mark">
          <strong>UR</strong>
          <em>বাংলা</em>
        </span>
        <span>
          <strong>Admin Panel</strong>
          <small>Moderate community submissions</small>
        </span>
      </a>
      <nav class="nav simple-nav" aria-label="Admin navigation">
        <a href="index.html">Public site</a>
        <a href="register.html">Registration</a>
      </nav>
    </header>

    <main class="admin-shell">
      <section class="admin-login" id="adminLogin">
        <p class="eyebrow">Admin access</p>
        <h1>Review posts before they go public.</h1>
        <form class="experience-form" id="adminTokenForm">
          <label>
            Admin token
            <input name="token" type="password" autocomplete="current-password" required />
          </label>
          <button class="button primary" type="submit">Open moderation</button>
          <p class="form-status" id="adminLoginStatus" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="admin-dashboard" id="adminDashboard" hidden>
        <div class="admin-dashboard-header">
          <div>
            <p class="eyebrow">Moderation queue</p>
            <h1>Community experiences</h1>
            <div class="status-tabs" aria-label="Post status filters">
              <button class="is-active" type="button" data-status-filter="pending">Pending</button>
              <button type="button" data-status-filter="approved">Approved</button>
              <button type="button" data-status-filter="rejected">Rejected</button>
            </div>
          </div>
          <div class="admin-actions">
            <button class="button secondary" id="refreshPosts" type="button">Refresh</button>
            <button class="button danger" id="logoutAdmin" type="button">Logout</button>
          </div>
        </div>
        <div class="admin-stats" id="adminStats" aria-live="polite"></div>
        <div class="admin-posts" id="adminPosts" aria-live="polite"></div>

        <section class="mailing-admin" aria-labelledby="mailingTitle">
          <div class="mailing-header">
            <div>
              <p class="eyebrow">Mailing directory</p>
              <h2 id="mailingTitle">Send community updates</h2>
            </div>
            <button class="button secondary" id="importDirectory" type="button">Refresh directory</button>
          </div>

          <div class="mailing-grid">
            <section class="directory-panel" aria-label="Directory contacts">
              <div class="directory-tools">
                <label>
                  Search
                  <input id="directorySearch" type="search" placeholder="Name, email, department" />
                </label>
                <label>
                  Status
                  <select id="directoryStatusFilter">
                    <option value="">All statuses</option>
                  </select>
                </label>
                <label>
                  Role
                  <select id="directoryRoleFilter">
                    <option value="">All roles</option>
                  </select>
                </label>
              </div>
              <div class="selection-tools">
                <strong id="selectedContactCount">0 selected</strong>
                <button class="button secondary compact-button" id="selectVisibleContacts" type="button">Select visible</button>
                <button class="button secondary compact-button" id="clearSelectedContacts" type="button">Clear</button>
              </div>
              <p class="form-status" id="directoryStatus" role="status" aria-live="polite"></p>
              <div class="directory-list" id="directoryContacts"></div>
            </section>

            <form class="mailing-form" id="mailingForm">
              <section class="group-builder" aria-labelledby="groupBuilderTitle">
                <p class="eyebrow" id="groupBuilderTitle">Saved groups</p>
                <label>
                  Group name
                  <input id="groupName" type="text" maxlength="120" placeholder="Welcome Tea Fall 2026" />
                </label>
                <label>
                  Paste emails from Excel
                  <textarea id="groupEmails" rows="5" placeholder="Paste one column, rows, or mixed cells with emails"></textarea>
                </label>
                <div class="form-row">
                  <label>
                    Default role
                    <input id="groupDefaultRole" type="text" maxlength="80" value="Event" />
                  </label>
                  <label>
                    Default status
                    <input id="groupDefaultStatus" type="text" maxlength="80" value="Event group" />
                  </label>
                </div>
                <button class="button secondary" id="createEmailGroup" type="button">Create group</button>
                <p class="form-status" id="groupStatus" role="status" aria-live="polite"></p>
              </section>

              <div>
                <p class="eyebrow">Audience</p>
                <label>
                  Saved group
                  <select id="mailingGroupSelect" multiple size="4"></select>
                </label>
                <div class="audience-options" id="mailingAudience"></div>
              </div>
              <label>
                Test email
                <input name="testEmail" type="email" placeholder="Optional test recipient" />
              </label>
              <label>
                Subject
                <input name="subject" type="text" placeholder="UR BSA: Welcome Tea Update" required />
              </label>
              <section class="compose-field" aria-labelledby="mailingMessageLabel">
                <div class="compose-label-row">
                  <span id="mailingMessageLabel">Message</span>
                  <small>Rich formatting with plain-text fallback</small>
                </div>
                <div class="compose-editor">
                  <div class="compose-toolbar" aria-label="Email formatting tools">
                    <button type="button" data-format="bold" aria-label="Bold"><strong>B</strong></button>
                    <button type="button" data-format="italic" aria-label="Italic"><em>I</em></button>
                    <button type="button" data-format="underline" aria-label="Underline"><span>U</span></button>
                    <button type="button" data-format="insertUnorderedList" aria-label="Bulleted list">List</button>
                    <button type="button" data-format="createLink" aria-label="Add link">Link</button>
                    <button type="button" data-format="removeFormat" aria-label="Clear formatting">Clear</button>
                  </div>
                  <div
                    class="compose-box"
                    id="mailingEditor"
                    contenteditable="true"
                    role="textbox"
                    aria-multiline="true"
                    aria-labelledby="mailingMessageLabel"
                    data-placeholder="Write the email body..."
                  ></div>
                </div>
                <textarea name="message" id="mailingMessage" hidden></textarea>
              </section>
              <button class="button primary" type="submit">Send email</button>
              <p class="form-status" id="mailingStatus" role="status" aria-live="polite"></p>
            </form>
          </div>
        </section>
      </section>
    </main>

    <script>
      window.UR_BANGLA_API_BASE = window.UR_BANGLA_API_BASE || "https://jerin-api.flyai.online/x006";
    </script>
    <script src="assets/js/admin.js?v=20260829-1" defer></script>
  </body>
</html>
